name: Update GitHub Data

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-github:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate github.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'EOF'
          const fs = require("fs");
          const path = require("path");

          const token = process.env.GITHUB_TOKEN;
          const repository = process.env.GITHUB_REPOSITORY;

          const [owner, repo] = repository.split("/");

          const apiBase = "https://api.github.com";

          const headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": `Bearer ${token}`,
              "X-GitHub-Api-Version": "2026-03-10",
              "User-Agent": "brdnwd.github.io-github-data"
          };

          async function githubFetch(endpoint) {
              const response = await fetch(
                  `${apiBase}${endpoint}`,
                  {
                      headers
                  }
              );

              if (!response.ok) {
                  const text = await response.text();

                  throw new Error(
                      `GitHub API error ${response.status}: ${text}`
                  );
              }

              return response.json();
          }

          /*
           * ------------------------------------------------------------
           * Repository
           * ------------------------------------------------------------
           */

          console.log("Fetching repository information...");

          const repositoryData = await githubFetch(
              `/repos/${owner}/${repo}`
          );

          const defaultBranch = repositoryData.default_branch;

          console.log(`Default branch: ${defaultBranch}`);


          /*
           * ------------------------------------------------------------
           * Recent commits
           * ------------------------------------------------------------
           */

          console.log("Fetching recent commits...");

          const commitData = await githubFetch(
              `/repos/${owner}/${repo}/commits?sha=${encodeURIComponent(defaultBranch)}&per_page=15`
          );

          /*
           * Ignore commits generated by this workflow.
           *
           * This prevents the generated github.json commit from
           * appearing as the "latest" website version.
           */

          const realCommits = commitData.filter((commit) => {
              const message = commit.commit?.message || "";
              const author = commit.author?.login || "";
              const committer = commit.committer?.login || "";

              if (
                  author === "github-actions[bot]" ||
                  committer === "github-actions[bot]"
              ) {
                  return false;
              }

              if (
                  message.startsWith("chore: update github data")
              ) {
                  return false;
              }

              return true;
          });

          /*
           * Only keep the five most recent real commits.
           */

          const recentCommitRefs = realCommits.slice(0, 5);

          console.log(
              `Found ${recentCommitRefs.length} recent commits.`
          );


          /*
           * ------------------------------------------------------------
           * Full commit information
           * ------------------------------------------------------------
           *
           * The commit list does not contain the complete stats,
           * so each commit is requested individually.
           */

          const recentCommits = [];

          for (const commitRef of recentCommitRefs) {
              console.log(
                  `Fetching commit ${commitRef.sha.substring(0, 7)}...`
              );

              const commit = await githubFetch(
                  `/repos/${owner}/${repo}/commits/${commitRef.sha}`
              );

              const message =
                  commit.commit?.message
                      ?.split("\n")[0]
                      ?.trim() || "";

              recentCommits.push({
                  sha: commit.sha,

                  shortSha: commit.sha.substring(0, 7),

                  message,

                  url: commit.html_url,

                  date: commit.commit?.author?.date || null,

                  additions: commit.stats?.additions ?? 0,

                  deletions: commit.stats?.deletions ?? 0,

                  changes: commit.stats?.total ?? 0
              });
          }


          /*
           * ------------------------------------------------------------
           * Current website version
           * ------------------------------------------------------------
           */

          const latestCommit =
              recentCommits[0] || null;


          /*
           * ------------------------------------------------------------
           * Repository languages
           * ------------------------------------------------------------
           */

          console.log("Fetching repository languages...");

          const languages = await githubFetch(
              `/repos/${owner}/${repo}/languages`
          );


          /*
           * Sort languages from most-used to least-used.
           */

          const sortedLanguages = Object.entries(languages)
              .sort(([, a], [, b]) => b - a);


          /*
           * Calculate total language bytes.
           */

          const totalLanguageBytes =
              sortedLanguages.reduce(
                  (total, [, bytes]) => total + bytes,
                  0
              );


          /*
           * Calculate language percentages.
           */

          const languageBreakdown =
              sortedLanguages.map(([name, bytes]) => {
                  const percentage =
                      totalLanguageBytes > 0
                          ? (bytes / totalLanguageBytes) * 100
                          : 0;

                  return {
                      name,

                      bytes,

                      percentage: Number(
                          percentage.toFixed(2)
                      )
                  };
              });


          /*
           * ------------------------------------------------------------
           * Most-used language
           * ------------------------------------------------------------
           */

          const primaryLanguage =
              languageBreakdown[0] || null;


          /*
           * ------------------------------------------------------------
           * Final JSON
           * ------------------------------------------------------------
           *
           * updatedAt intentionally comes first.
           */

          const githubData = {
              updatedAt: new Date().toISOString(),

              repository: {
                  name: repositoryData.name,

                  fullName: repositoryData.full_name,

                  owner,

                  branch: defaultBranch,

                  url: repositoryData.html_url
              },

              version: {
                  sha: latestCommit?.sha || null,

                  shortSha: latestCommit?.shortSha || null,

                  message: latestCommit?.message || null,

                  url: latestCommit?.url || null,

                  date: latestCommit?.date || null
              },

              recentCommits,

              languages,

              languageBreakdown,

              primaryLanguage: {
                  name: primaryLanguage?.name || null,

                  bytes: primaryLanguage?.bytes || 0,

                  percentage: primaryLanguage?.percentage || 0
              }
          };


          /*
           * ------------------------------------------------------------
           * Write github.json
           * ------------------------------------------------------------
           */

          const outputPath = path.join(
              process.cwd(),
              "src",
              "res",
              "json",
              "github.json"
          );

          fs.mkdirSync(
              path.dirname(outputPath),
              {
                  recursive: true
              }
          );

          fs.writeFileSync(
              outputPath,

              JSON.stringify(
                  githubData,
                  null,
                  2
              ) + "\n",

              "utf8"
          );


          /*
           * ------------------------------------------------------------
           * Output information
           * ------------------------------------------------------------
           */

          console.log("");
          console.log("GitHub data generated successfully.");
          console.log("");
          console.log(`Output: ${outputPath}`);
          console.log(
              `Version: ${latestCommit?.shortSha || "unknown"}`
          );
          console.log(
              `Primary language: ${primaryLanguage?.name || "unknown"}`
          );
          console.log(
              `Recent commits: ${recentCommits.length}`
          );
          console.log(
              `Languages: ${languageBreakdown.length}`
          );
          EOF

      - name: Commit updated GitHub data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/res/json/github.json

          if git diff --cached --quiet; then
            echo "No GitHub data changes."
            exit 0
          fi

          git commit -m "Chore: Update Github Data"
          git push