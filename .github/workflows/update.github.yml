name: Update GitHub Data

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-github:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate github.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'EOF'
          (async function () {
              const fs = require("fs");
              const path = require("path");

              const token = process.env.GITHUB_TOKEN;
              const repository = process.env.GITHUB_REPOSITORY;

              const [owner, repo] = repository.split("/");

              const apiBase = "https://api.github.com";

              const headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": `Bearer ${token}`,
                  "X-GitHub-Api-Version": "2026-03-10",
                  "User-Agent": "brdnwd.github.io-github-data"
              };


              /*
               * --------------------------------------------------------
               * GitHub API
               * --------------------------------------------------------
               */

              async function githubFetch(endpoint) {
                  const response = await fetch(
                      `${apiBase}${endpoint}`,
                      {
                          headers
                      }
                  );

                  if (!response.ok) {
                      const text = await response.text();

                      throw new Error(
                          `GitHub API error ${response.status}: ${text}`
                      );
                  }

                  return response.json();
              }


              /*
               * --------------------------------------------------------
               * Repository
               * --------------------------------------------------------
               */

              console.log(
                  "Fetching repository information..."
              );

              const repositoryData =
                  await githubFetch(
                      `/repos/${owner}/${repo}`
                  );

              const defaultBranch =
                  repositoryData.default_branch;

              console.log(
                  `Default branch: ${defaultBranch}`
              );


              /*
               * --------------------------------------------------------
               * Recent commits
               * --------------------------------------------------------
               */

              console.log(
                  "Fetching recent commits..."
              );

              const commitData =
                  await githubFetch(
                      `/repos/${owner}/${repo}/commits?sha=${encodeURIComponent(defaultBranch)}&per_page=15`
                  );


              /*
               * Ignore commits generated by GitHub Actions.
               *
               * This prevents github.json's own commit from becoming
               * the displayed website version.
               */

              const realCommits =
                  commitData.filter((commit) => {
                      const message =
                          commit.commit?.message || "";

                      const author =
                          commit.author?.login || "";

                      const committer =
                          commit.committer?.login || "";


                      if (
                          author === "github-actions[bot]" ||
                          committer === "github-actions[bot]"
                      ) {
                          return false;
                      }


                      if (
                          message.startsWith(
                              "Chore: Update Github Data"
                          )
                      ) {
                          return false;
                      }


                      return true;
                  });


              /*
               * Get the five most recent real commits.
               */

              const recentCommitRefs =
                  realCommits.slice(0, 5);

              console.log(
                  `Found ${recentCommitRefs.length} recent commits.`
              );


              /*
               * --------------------------------------------------------
               * Full commit information
               * --------------------------------------------------------
               *
               * The commit list does not contain full stats,
               * so each commit is requested individually.
               */

              const recentCommits = [];

              for (
                  const commitRef of recentCommitRefs
              ) {
                  console.log(
                      `Fetching commit ${commitRef.sha.substring(0, 7)}...`
                  );


                  const commit =
                      await githubFetch(
                          `/repos/${owner}/${repo}/commits/${commitRef.sha}`
                      );


                  const message =
                      commit.commit?.message
                          ?.split("\n")[0]
                          ?.trim() || "";


                  recentCommits.push({
                      sha: commit.sha,

                      shortSha:
                          commit.sha.substring(0, 7),

                      message,

                      url:
                          commit.html_url,

                      date:
                          commit.commit?.author?.date ||
                          null,

                      additions:
                          commit.stats?.additions ??
                          0,

                      deletions:
                          commit.stats?.deletions ??
                          0,

                      changes:
                          commit.stats?.total ??
                          0
                  });
              }


              /*
               * --------------------------------------------------------
               * Current website version
               * --------------------------------------------------------
               */

              const latestCommit =
                  recentCommits[0] || null;


              /*
               * --------------------------------------------------------
               * Public GitHub repositories
               * --------------------------------------------------------
               *
               * Fetch every public repository owned by the account.
               *
               * GitHub returns a maximum of 100 repositories per page,
               * so continue requesting pages until an empty page is
               * returned.
               */

              console.log(
                  "Fetching public GitHub repositories..."
              );

              const publicRepositories = [];

              let repositoryPage = 1;

              while (true) {
                  const repositories =
                      await githubFetch(
                          `/users/${owner}/repos?type=owner&per_page=100&page=${repositoryPage}`
                      );


                  if (
                      !Array.isArray(repositories) ||
                      repositories.length === 0
                  ) {
                      break;
                  }


                  for (
                      const repositoryItem
                      of repositories
                  ) {
                      /*
                       * The endpoint returns public repositories,
                       * but keep this check for safety.
                       */

                      if (
                          repositoryItem.private === false
                      ) {
                          publicRepositories.push(
                              repositoryItem
                          );
                      }
                  }


                  console.log(
                      `Fetched repository page ${repositoryPage}: ${repositories.length} repositories.`
                  );


                  if (
                      repositories.length < 100
                  ) {
                      break;
                  }


                  repositoryPage++;
              }


              console.log(
                  `Found ${publicRepositories.length} public repositories.`
              );


              /*
               * --------------------------------------------------------
               * Account-wide languages
               * --------------------------------------------------------
               *
               * GitHub's language endpoint gives byte counts for each
               * repository.
               *
               * These are combined across every public repository.
               */

              console.log(
                  "Calculating account-wide languages..."
              );

              const languageTotals = {};


              for (
                  const repositoryItem
                  of publicRepositories
              ) {
                  console.log(
                      `Fetching languages: ${repositoryItem.full_name}`
                  );


                  const repositoryLanguages =
                      await githubFetch(
                          `/repos/${repositoryItem.full_name}/languages`
                      );


                  for (
                      const [
                          language,
                          bytes
                      ]
                      of Object.entries(
                          repositoryLanguages
                      )
                  ) {
                      languageTotals[language] =
                          (
                              languageTotals[language] ||
                              0
                          ) + bytes;
                  }
              }


              /*
               * --------------------------------------------------------
               * Sort account-wide languages
               * --------------------------------------------------------
               */

              const sortedLanguages =
                  Object.entries(languageTotals)
                      .sort(
                          ([, a], [, b]) =>
                              b - a
                      );


              /*
               * --------------------------------------------------------
               * Total language bytes
               * --------------------------------------------------------
               */

              const totalLanguageBytes =
                  sortedLanguages.reduce(
                      (total, [, bytes]) =>
                          total + bytes,
                      0
                  );


              /*
               * --------------------------------------------------------
               * Account-wide language percentages
               * --------------------------------------------------------
               */

              const languageBreakdown =
                  sortedLanguages.map(
                      ([name, bytes]) => {
                          const percentage =
                              totalLanguageBytes > 0
                                  ? (
                                      bytes /
                                      totalLanguageBytes
                                  ) * 100
                                  : 0;


                          return {
                              name,

                              bytes,

                              percentage:
                                  Number(
                                      percentage.toFixed(2)
                                  )
                          };
                      }
                  );


              /*
               * --------------------------------------------------------
               * Most-used account-wide language
               * --------------------------------------------------------
               */

              const primaryLanguage =
                  languageBreakdown[0] ||
                  null;


              /*
               * --------------------------------------------------------
               * Final GitHub data
               * --------------------------------------------------------
               *
               * updatedAt intentionally comes first.
               */

              const githubData = {
                  updatedAt:
                      new Date().toISOString(),


                  repository: {
                      name:
                          repositoryData.name,

                      fullName:
                          repositoryData.full_name,

                      owner,

                      branch:
                          defaultBranch,

                      url:
                          repositoryData.html_url
                  },


                  version: {
                      sha:
                          latestCommit?.sha ||
                          null,

                      shortSha:
                          latestCommit?.shortSha ||
                          null,

                      message:
                          latestCommit?.message ||
                          null,

                      url:
                          latestCommit?.url ||
                          null,

                      date:
                          latestCommit?.date ||
                          null
                  },


                  recentCommits,


                  repositories: {
                      count:
                          publicRepositories.length,

                      public: publicRepositories.map(
                          (repositoryItem) => ({
                              name:
                                  repositoryItem.name,

                              fullName:
                                  repositoryItem.full_name,

                              url:
                                  repositoryItem.html_url,

                              fork:
                                  repositoryItem.fork,

                              archived:
                                  repositoryItem.archived
                          })
                      )
                  },


                  languages:
                      languageTotals,


                  languageBreakdown,


                  primaryLanguage: {
                      name:
                          primaryLanguage?.name ||
                          null,

                      bytes:
                          primaryLanguage?.bytes ||
                          0,

                      percentage:
                          primaryLanguage?.percentage ||
                          0
                  }
              };


              /*
               * --------------------------------------------------------
               * Write github.json
               * --------------------------------------------------------
               */

              const outputPath =
                  path.join(
                      process.cwd(),
                      "src",
                      "res",
                      "json",
                      "github.json"
                  );


              fs.mkdirSync(
                  path.dirname(outputPath),
                  {
                      recursive: true
                  }
              );


              fs.writeFileSync(
                  outputPath,

                  JSON.stringify(
                      githubData,
                      null,
                      2
                  ) + "\n",

                  "utf8"
              );


              /*
               * --------------------------------------------------------
               * Output information
               * --------------------------------------------------------
               */

              console.log("");

              console.log(
                  "GitHub data generated successfully."
              );

              console.log("");

              console.log(
                  `Output: ${outputPath}`
              );

              console.log(
                  `Version: ${
                      latestCommit?.shortSha ||
                      "unknown"
                  }`
              );

              console.log(
                  `Public repositories: ${
                      publicRepositories.length
                  }`
              );

              console.log(
                  `Primary language: ${
                      primaryLanguage?.name ||
                      "unknown"
                  }`
              );

              console.log(
                  `Recent commits: ${
                      recentCommits.length
                  }`
              );

              console.log(
                  `Languages: ${
                      languageBreakdown.length
                  }`
              );
          })();
          EOF

      - name: Commit updated GitHub data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/res/json/github.json

          if git diff --cached --quiet; then
            echo "No GitHub data changes."
            exit 0
          fi

          git commit -m "Chore: Update Github Data"
          git push