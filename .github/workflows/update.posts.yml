name: Update DEV.to Data

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-devto:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate posts.json
        run: |
          node <<'EOF'
          (async function () {
              const fs = require("fs");
              const path = require("path");

              const username = "brdnwd";
              const apiBase = "https://dev.to/api";

              /*
               * --------------------------------------------------------
               * DEV.to API
               * --------------------------------------------------------
               */

              async function devtoFetch(endpoint) {
                  const response = await fetch(
                      `${apiBase}${endpoint}`,
                      {
                          headers: {
                              "Accept": "application/json",
                              "User-Agent": "brdnwd.github.io-devto-data"
                          }
                      }
                  );

                  if (!response.ok) {
                      const text = await response.text();

                      throw new Error(
                          `DEV.to API error ${response.status}: ${text}`
                      );
                  }

                  return response.json();
              }


              /*
               * --------------------------------------------------------
               * Profile
               * --------------------------------------------------------
               */

              console.log(
                  "Fetching DEV.to profile information..."
              );

              const profile =
                  await devtoFetch(
                      `/users/by_username?url=${username}`
                  );


              /*
               * --------------------------------------------------------
               * Recent posts
               * --------------------------------------------------------
               */

              console.log(
                  "Fetching recent DEV.to posts..."
              );

              const articles =
                  await devtoFetch(
                      `/articles?username=${username}&per_page=10`
                  );


              /*
               * --------------------------------------------------------
               * Post data
               * --------------------------------------------------------
               */

              const posts =
                  articles.map((article) => ({
                      id:
                          article.id,

                      title:
                          article.title,

                      description:
                          article.description,

                      url:
                          article.url,

                      publishedAt:
                          article.published_at ||
                          null,

                      readablePublishDate:
                          article.readable_publish_date ||
                          null,

                      tags:
                          article.tag_list ||
                          [],

                      coverImage:
                          article.cover_image ||
                          null,

                      socialImage:
                          article.social_image ||
                          null,

                      readingTimeMinutes:
                          article.reading_time_minutes ||
                          0,

                      commentsCount:
                          article.comments_count ||
                          0,

                      positiveReactionsCount:
                          article.positive_reactions_count ||
                          0
                  }));


              /*
               * --------------------------------------------------------
               * Final DEV.to data
               * --------------------------------------------------------
               *
               * updatedAt intentionally comes first.
               */

              const devtoData = {
                  updatedAt:
                      new Date().toISOString(),


                  profile: {
                      username:
                          profile.username,

                      name:
                          profile.name,

                      userId:
                          profile.user_id,

                      profileImage:
                          profile.profile_image ||
                          null,

                      profileImage90:
                          profile.profile_image_90 ||
                          null,

                      joinedAt:
                          profile.joined_at ||
                          null,

                      websiteUrl:
                          profile.website_url ||
                          null,

                      location:
                          profile.location ||
                          null,

                      summary:
                          profile.summary ||
                          null,

                      twitterUsername:
                          profile.twitter_username ||
                          null,

                      githubUsername:
                          profile.github_username ||
                          null,

                      personalWebsite:
                          profile.website_url ||
                          null,

                      profileUrl:
                          `https://dev.to/${profile.username}`
                  },


                  posts: {
                      count:
                          posts.length,

                      public:
                          posts
                  }
              };


              /*
               * --------------------------------------------------------
               * Write posts.json
               * --------------------------------------------------------
               */

              const outputPath =
                  path.join(
                      process.cwd(),
                      "src",
                      "res",
                      "json",
                      "posts.json"
                  );


              fs.mkdirSync(
                  path.dirname(outputPath),
                  {
                      recursive: true
                  }
              );


              fs.writeFileSync(
                  outputPath,

                  JSON.stringify(
                      devtoData,
                      null,
                      2
                  ) + "\n",

                  "utf8"
              );


              /*
               * --------------------------------------------------------
               * Output information
               * --------------------------------------------------------
               */

              console.log("");

              console.log(
                  "DEV.to data generated successfully."
              );

              console.log("");

              console.log(
                  `Output: ${outputPath}`
              );

              console.log(
                  `Username: ${profile.username}`
              );

              console.log(
                  `Posts: ${posts.length}`
              );

              console.log(
                  `Updated: ${devtoData.updatedAt}`
              );
          })();
          EOF

      - name: Commit updated DEV.to data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/res/json/posts.json

          if git diff --cached --quiet; then
            echo "No DEV.to data changes."
            exit 0
          fi

          git commit -m "Chore: Update DEV.to Data"
          git push